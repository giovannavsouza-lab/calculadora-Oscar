<!DOCTYPE html>


<html lang="es"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>
   <style>
    /* Variáveis para o tema Neon Alien */
    :root {
        --bg-dark: #000000;
        --bg-medium: #111111;
        --neon-green-primary: #39ff14; /* Verde Elétrico Brilhante */
        --neon-green-secondary: #228b22; /* Verde mais escuro/Borda */
        --text-light: #ffffff;
        --text-dim: #999999;
        --error-color: #ff4500; /* Laranja/Vermelho para erro */
    }

    body {
        font-family: 'Consolas', 'Courier New', monospace; /* Fonte tecnológica */
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
        background: var(--bg-dark);
        color: var(--neon-green-primary);
        /* Efeito de grade sutil para o fundo */
        background-image: radial-gradient(var(--neon-green-secondary) 1px, transparent 1px);
        background-size: 40px 40px;
    }
    
    .container {
        background: var(--bg-medium);
        padding: 30px;
        border-radius: 10px;
        /* Efeito de brilho neon na caixa principal */
        box-shadow: 0 0 20px rgba(57, 255, 20, 0.7);
        border: 2px solid var(--neon-green-secondary);
        width: 300px;
    }
    
    h1 {
        text-align: center;
        color: var(--neon-green-primary);
        margin-top: 0;
        margin-bottom: 25px;
        text-shadow: 0 0 8px rgba(57, 255, 20, 0.8);
        border-bottom: 1px solid var(--neon-green-secondary);
        padding-bottom: 10px;
    }
    
    .input-group {
        margin-bottom: 15px;
    }
    
    label {
        display: block;
        margin-bottom: 5px;
        color: var(--neon-green-primary);
        font-weight: bold;
        text-transform: uppercase;
    }
    
    input, select {
        width: 100%;
        padding: 10px;
        background: var(--bg-dark);
        color: var(--neon-green-primary);
        border: 2px solid var(--neon-green-secondary);
        border-radius: 5px;
        font-size: 16px;
        box-sizing: border-box;
        transition: border-color 0.3s, box-shadow 0.3s;
    }
    
    input:focus, select:focus {
        outline: none;
        border-color: var(--neon-green-primary);
        /* Efeito de foco neon */
        box-shadow: 0 0 8px var(--neon-green-primary);
    }
    
    select {
        cursor: pointer;
        /* Remove a seta padrão e adiciona uma cor */
        -webkit-appearance: none;
        -moz-appearance: none;
        appearance: none;
        background-image: url('data:image/svg+xml;charset=US-ASCII,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 4 5"><path fill="%2339ff14" d="M2 0L0 2h4zm0 5L0 3h4z"/></svg>');
        background-repeat: no-repeat;
        background-position: right 10px top 50%;
        background-size: 8px auto;
    }
    
    .botones {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 10px;
        margin-top: 25px;
    }
    
    button {
        padding: 15px;
        background: var(--neon-green-secondary);
        color: var(--bg-dark);
        border: 2px solid var(--neon-green-primary);
        border-radius: 5px;
        font-size: 18px;
        font-weight: bold;
        cursor: pointer;
        transition: all 0.2s;
        text-transform: uppercase;
        box-shadow: 0 0 5px rgba(57, 255, 20, 0.5);
    }
    
    button:hover {
        background: var(--neon-green-primary);
        color: var(--bg-dark);
        /* Brilho mais intenso ao passar o mouse */
        box-shadow: 0 0 15px var(--neon-green-primary);
    }
    
    button:active {
        transform: scale(0.9);
        box-shadow: 0 0 5px var(--neon-green-primary);
    }
    
    .resultado {
        margin-top: 30px;
        padding: 15px;
        background: var(--bg-dark);
        border: 2px solid var(--neon-green-primary);
        border-radius: 5px;
        text-align: center;
        font-size: 20px;
        font-weight: bold;
        color: var(--neon-green-primary);
        box-shadow: 0 0 10px rgba(57, 255, 20, 0.5);
    }
    
    .error {
        background: var(--bg-medium);
        border-color: var(--error-color);
        color: var(--error-color);
        box-shadow: 0 0 10px var(--error-color);
    }
</style>
</head>
<body>
    <div class="container">
        <h1>Calculadora</h1>
        
        <div class="input-group">
            <label for="numero1">Primer número:</label>
            <input type="number" id="numero1" placeholder="Ingresa el primer número">
        </div>
        
        <div class="input-group">
            <label for="numero2">Segundo número:</label>
            <input type="number" id="numero2" placeholder="Ingresa el segundo número">
        </div>
        
        <div class="botones">
            <button onclick="realizarOperacion(&#39;+&#39;)">+</button>
            <button onclick="realizarOperacion(&#39;-&#39;)">−</button>
            <button onclick="realizarOperacion(&#39;*&#39;)">×</button>
            <button onclick="realizarOperacion(&#39;/&#39;)">÷</button>
        </div>
        
        <div id="resultado" class="resultado" style="display: none;">
            <span id="valorResultado"></span>
        </div>
    </div>
    
    <script>
        function calcular(a, b, operador) {
            const num1 = Number(a);
            const num2 = Number(b);
            
            if (isNaN(num1) || isNaN(num2)) {
                return "Error: valores inválidos";
            }
            
            switch (operador) {
                case '+': return num1 + num2;
                case '-': return num1 - num2;
                case '*': return num1 * num2;
                case '/': 
                    return num2 !== 0 ? 
                        num1 / num2 : 
                        "Error: división por cero";
                default: 
                    return "Operador inválido";
            }
        }
        
        function realizarOperacion(operador) {
            const num1 = document.getElementById('numero1').value;
            const num2 = document.getElementById('numero2').value;
            
            // Si se pasa operador como parámetro, usarlo. Si no, tomar del select
            const op = operador || document.getElementById('operador').value;
            
            const resultado = calcular(num1, num2, op);
            
            const resultadoDiv = document.getElementById('resultado');
            const valorResultado = document.getElementById('valorResultado');
            
            // Verificar si es un error
            if (typeof resultado === 'string' && resultado.includes('Error')) {
                resultadoDiv.classList.add('error');
                valorResultado.textContent = resultado;
            } else {
                resultadoDiv.classList.remove('error');
                valorResultado.textContent = `Resultado: ${resultado}`;
            }
            
            resultadoDiv.style.display = 'block';
        }
        
        // Permitir calcular con Enter
        document.getElementById('numero2').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                realizarOperacion();
            }
        });
    </script>

</body></html>
